packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@deepseek-ai/dsh-subprocess-local': true
  node-pty: true
  koffi: true
  '@google/genai': false

# DeepSeek Harness 0.2.0-rc.1 is source-reviewed and pinned by commit in
# infra/harness/version.env. Keep the global age policy for every other package.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
