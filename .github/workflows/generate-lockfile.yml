name: Generate lockfile
on:
  push:
    branches:
      - phase/04-research-operations
    paths:
      - apps/web/package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Print generated lockfile
        run: |
          echo '---LOCKFILE-BEGIN---'
          cat pnpm-lock.yaml
          echo '---LOCKFILE-END---'
