name: Generate storage lockfile artifact

on:
  push:
    branches:
      - phase/04-research-operations
    paths:
      - .github/workflows/storage-lockfile-artifact.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Generate exact storage dependency lockfile
        shell: bash
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: phase4a-storage-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock storage dependency"
          git push
