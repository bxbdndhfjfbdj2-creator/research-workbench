name: Refresh Harness SDK lockfile

on:
  push:
    branches:
      - phase/03-agent-runtime
    paths:
      - packages/harness-adapter/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Resolve pinned Harness SDK dependency
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock pinned DeepSeek Harness SDK"
          git push origin HEAD:phase/03-agent-runtime
