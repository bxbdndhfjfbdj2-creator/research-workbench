<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="网页组织运行时：制度稳定，组织状态持续运行。">
  <title>组织运行时 · 网页原型</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">组</span><div><strong id="world-name">组织运行时</strong><small>制度编译 · 组织运行</small></div></div>
      <nav id="main-nav" aria-label="主导航">
        <button class="nav-item active" data-view="overview">总览</button>
        <button class="nav-item" data-view="people">人员</button>
        <button class="nav-item" data-view="departments">部门</button>
        <button class="nav-item" data-view="projects">项目</button>
        <button class="nav-item" data-view="relations">关系</button>
        <button class="nav-item" data-view="events">事件</button>
        <button class="nav-item" data-view="policy">制度</button>
      </nav>
      <div class="sidebar-foot"><button id="reset-button" class="quiet-button" type="button">重置演示</button></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div><p>当前模型</p><strong id="model-version">—</strong></div><button id="toggle-operations" class="primary-button" type="button">组织变更</button></header>
      <div id="notice" class="notice" hidden></div>
      <section id="view-root" class="view-root" aria-live="polite"></section>
    </main>
    <aside id="operation-panel" class="operation-panel" aria-label="组织变更面板">
      <div class="operation-head"><div><p class="kicker">运行时事件</p><h2>组织变更</h2></div><button id="close-operations" class="icon-button" type="button" aria-label="关闭">×</button></div>
      <p class="operation-copy">所有操作先形成事件，再以事务方式改变当前组织世界。</p>
      <form id="operation-form">
        <label>操作类型<select id="operation-type" name="type"></select></label>
        <div id="operation-fields"></div>
        <button class="primary-button wide" type="submit">执行事件</button>
      </form>
    </aside>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
